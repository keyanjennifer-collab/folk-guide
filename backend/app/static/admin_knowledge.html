<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI国学知识库后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f3ef;color:#29352f;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 5%;background:#29493a;color:#fff}.wrap{max-width:1200px;margin:20px auto;padding:0 20px}.panel{margin-bottom:18px;padding:20px;background:#fff;border-radius:14px;box-shadow:0 6px 24px #26352e0d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{display:block;color:#607067;font-size:12px}input,select,textarea{width:100%;margin-top:5px;padding:10px;border:1px solid #dbe2dd;border-radius:8px;font:inherit}textarea{min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:9px 14px;border:0;border-radius:8px;background:#385f4d;color:#fff;cursor:pointer}.secondary{background:#e6ece8;color:#385f4d}.danger{background:#a94b42}.documents,.chunks{display:grid;gap:10px}.item{padding:14px;border:1px solid #dfe5e1;border-radius:10px}.item-head{display:flex;justify-content:space-between;gap:12px}.status{display:inline-block;padding:3px 8px;border-radius:14px;background:#e7eee9;color:#385f4d;font-size:11px}.meta{color:#7c8982;font-size:12px}.chunk-content{margin-top:9px;padding:10px;background:#f5f7f5;white-space:pre-wrap}.result{padding:12px;background:#edf3ef;border-radius:9px;white-space:pre-wrap}.search-result{padding:13px;border-bottom:1px solid #e1e6e2}.search-result b{color:#385f4d}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>AI国学知识库后台</h1><div>上传 · 解析 · 切片 · 人工审核 · 检索预览</div></header><div class="wrap">
<section class="panel"><div class="grid"><label>管理员Key<input id="adminKey" type="password" value="dev-admin-key"></label><label>操作人<input id="adminName" value="knowledge-reviewer"></label><label>标题<input id="title"></label><label>资料来源<input id="sourceName"></label><label>作者<input id="author"></label><label>版权状态<select id="copyright"><option value="original">项目原创</option><option value="public_domain">公版资料</option><option value="licensed">已获授权</option><option value="permission_pending">等待授权</option></select></label><label>选择文件<input id="file" type="file" accept=".docx,.md,.txt,.pdf"></label><label>PDF解析方式<select id="pdfParserMode"><option value="auto">自动判断（推荐）</option><option value="native">仅本地文字层</option><option value="mineru">使用MinerU/OCR</option></select></label></div><div class="meta">文字型PDF在本机逐页提取；扫描版只有配置并启用MinerU后才会发送到指定服务。系统会保留PDF物理页码，未识别页面不能审核入库。</div><div class="actions"><button onclick="upload()">上传文件</button><button class="secondary" onclick="loadDocuments()">刷新文档列表</button></div></section>
<section class="panel"><h2>文档列表</h2><div id="documents" class="documents"></div></section>
<section class="panel"><h2>切片审核</h2><div class="meta">先在文档列表点击“解析/查看切片”。修改内容会使片段回到待审核状态。</div><div id="chunks" class="chunks"></div><div class="actions"><button onclick="approveAll()">审核通过全部片段</button></div></section>
<section class="panel"><h2>检索预览</h2><div class="actions"><input id="query" placeholder="例如：立春 节气" style="max-width:420px"><button onclick="searchKnowledge()">关键词检索</button></div><div id="searchResults"></div></section>
<section class="panel"><h2>操作结果</h2><div id="result" class="result">等待操作</div></section>
</div><script>
let selectedDocument=null,loadedChunks=[];function h(){return{'X-Admin-Key':adminKey.value,'X-Admin-Name':adminName.value}}function show(v){result.textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...h(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail||d));return d}
async function upload(){const f=file.files[0];if(!f)return show('请选择.docx、.md、.txt或.pdf');const form=new FormData();form.append('file',f);form.append('title',title.value);form.append('source_name',sourceName.value);form.append('author',author.value);form.append('copyright_status',copyright.value);try{const r=await fetch('/api/admin/knowledge/documents',{method:'POST',headers:h(),body:form});const d=await r.json();if(!r.ok)throw new Error(d.detail||'上传失败');show(d);loadDocuments()}catch(e){show('上传失败：'+e.message)}}
function docMeta(d){const parts=[d.original_filename,`${d.chunk_count}片`,`审核通过${d.approved_chunk_count}片`,d.copyright_status];if(d.page_count)parts.push(`${d.page_count}页`);if(d.extraction_method)parts.push(d.extraction_method);if(d.needs_ocr)parts.push('需要OCR');return parts.map(escapeHtml).join(' · ')}
async function loadDocuments(){try{const docs=await api('/api/admin/knowledge/documents');documents.innerHTML='';docs.forEach(d=>{const el=document.createElement('div');el.className='item';const warning=d.parse_warning?`<div class="meta">提示：${escapeHtml(d.parse_warning)}</div>`:'';el.innerHTML=`<div class="item-head"><span><b>${escapeHtml(d.title)}</b> <i class="status">${escapeHtml(d.status)}</i><br><span class="meta">${docMeta(d)}</span>${warning}</span><span class="actions"><button data-a="parse">解析</button><button class="secondary" data-a="chunks">查看切片</button><button class="danger" data-a="disable">停用</button></span></div>`;el.querySelector('[data-a=parse]').onclick=()=>parseDoc(d.id);el.querySelector('[data-a=chunks]').onclick=()=>loadChunks(d.id);el.querySelector('[data-a=disable]').onclick=()=>disableDoc(d.id);documents.appendChild(el)})}catch(e){show(e.message)}}
async function parseDoc(id){try{const mode=encodeURIComponent(pdfParserMode.value);show(await api(`/api/admin/knowledge/documents/${id}/parse?parser_mode=${mode}`,{method:'POST'}));await loadDocuments();await loadChunks(id)}catch(e){show('解析失败：'+e.message);loadDocuments()}}async function disableDoc(id){try{show(await api(`/api/admin/knowledge/documents/${id}/disable`,{method:'POST'}));loadDocuments()}catch(e){show(e.message)}}
function pageLabel(c){if(!c.page_start)return'无页码';return c.page_end&&c.page_end!==c.page_start?`PDF第${c.page_start}—${c.page_end}页`:`PDF第${c.page_start}页`}
async function loadChunks(id){try{selectedDocument=id;loadedChunks=await api(`/api/admin/knowledge/documents/${id}/chunks`);chunks.innerHTML='';loadedChunks.forEach(c=>{const el=document.createElement('div');el.className='item';const confidence=c.ocr_confidence==null?'':` · OCR置信度${(c.ocr_confidence*100).toFixed(1)}%`;el.innerHTML=`<div class="item-head"><b>片段 ${c.chunk_index+1} · ${escapeHtml(c.heading||'无标题')}</b><i class="status">${escapeHtml(c.review_status)}</i></div><div class="meta">${c.character_count}字 · ${pageLabel(c)} · ${escapeHtml(c.extraction_method||'普通文本')}${confidence} · ${c.content_hash.slice(0,12)}</div><textarea>${escapeHtml(c.content)}</textarea><div class="actions"><button>保存修改</button></div>`;el.querySelector('button').onclick=()=>saveChunk(c.id,el.querySelector('textarea').value,c.heading);chunks.appendChild(el)})}catch(e){show(e.message)}}
async function saveChunk(id,content,heading){try{show(await api(`/api/admin/knowledge/chunks/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({heading,content})}));loadChunks(selectedDocument)}catch(e){show(e.message)}}async function approveAll(){if(!selectedDocument)return show('请先选择文档');try{show(await api(`/api/admin/knowledge/documents/${selectedDocument}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved_chunk_ids:null})}));loadDocuments();loadChunks(selectedDocument)}catch(e){show(e.message)}}
async function searchKnowledge(){try{const r=await api('/api/admin/knowledge/search?q='+encodeURIComponent(query.value));searchResults.innerHTML=r.map(x=>`<div class="search-result"><b>${escapeHtml(x.title)} / ${escapeHtml(x.heading||'无标题')}</b><div class="meta">来源：${escapeHtml(x.source_name)} · ${pageLabel(x)} · 分数 ${x.score.toFixed(2)}</div><div>${escapeHtml(x.content)}</div></div>`).join('')||'<p class="meta">没有命中已审核资料</p>'}catch(e){show(e.message)}}function escapeHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}loadDocuments();
</script></body></html>
