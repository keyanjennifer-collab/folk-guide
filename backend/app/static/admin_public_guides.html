<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日五色运营后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f3ef;color:#29352f;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 5%;background:#29493a;color:#fff}header h1{margin:0}.wrap{max-width:1280px;margin:20px auto;padding:0 20px}.panel{margin-bottom:18px;padding:20px;background:#fff;border-radius:14px;box-shadow:0 6px 24px #26352e0d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{display:block;color:#607067;font-size:12px}input,textarea,select{width:100%;margin-top:5px;padding:10px;border:1px solid #dbe2dd;border-radius:8px;font:inherit}textarea{min-height:68px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 16px;border:0;border-radius:8px;background:#385f4d;color:#fff;cursor:pointer}.secondary{background:#e6ece8;color:#385f4d}.danger{background:#a94b42}.color-card{margin-top:12px;padding:14px;border:1px solid #e0e5e1;border-radius:11px}.color-head{display:flex;justify-content:space-between;align-items:center}.color-fields{display:grid;grid-template-columns:80px 90px 110px 1fr 1fr;gap:9px;margin-top:10px}.status{padding:12px;background:#edf3ef;border-radius:9px;white-space:pre-wrap}.muted{color:#7c8982}@media(max-width:800px){.grid,.color-fields{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>今日五色运营后台</h1><div>人工录入 · 审核 · 发布 · Excel批量导入</div></header><div class="wrap">
<section class="panel"><div class="grid"><label>管理员Key<input id="adminKey" type="password" value="dev-admin-key"></label><label>操作人<input id="adminName" value="operator"></label><label>目标日期<input id="guideDate" type="date"></label><label>当前状态<input id="currentStatus" value="尚未读取" readonly></label></div><div class="actions" style="margin-top:14px"><button onclick="loadGuide()">读取日期</button><button onclick="saveDraft()">保存草稿</button><button class="secondary" onclick="act('review')">提交审核</button><label>定时发布时间<input id="scheduleAt" type="datetime-local"></label><button class="secondary" onclick="scheduleGuide()">设置定时发布</button><button onclick="act('publish')">立即发布</button><button class="danger" onclick="act('withdraw')">撤回</button></div></section>
<section class="panel"><h2>基础信息</h2><div class="grid"><label>星期<input id="weekday" placeholder="星期一"></label><label>农历<input id="lunarDate" placeholder="农历六月廿四"></label><label>节气<input id="solarTerm" placeholder="立秋"></label><label>当日干支<input id="dayGanzhi" placeholder="甲子"></label></div><div class="grid" style="margin-top:10px"><label>分享标题<input id="shareTitle" value="今日五色排名"></label><label>分享摘要<input id="shareSummary" value="今日完整五色建议已更新"></label><label>推送摘要<input id="pushSummary" value="今日五色已更新"></label><label>规则版本<input id="ruleVersion" value="manual-v1"></label></div></section>
<section class="panel"><h2>五色排名</h2><div class="muted">每个颜色必须出现一次，排名必须为1至5，颜色与五行关系固定。</div><div id="colors"></div></section>
<section class="panel"><h2>Excel批量导入</h2><div class="actions"><button class="secondary" onclick="downloadTemplate()">下载模板</button><input id="excelFile" type="file" accept=".xlsx" style="max-width:360px"><button onclick="importExcel()">上传并导入草稿</button></div></section>
<section class="panel"><h2>操作结果</h2><div class="status" id="result">等待操作</div></section>
</div><script>
const presets=[['绿金','木','GREEN'],['黑金','水','BLACK'],['黄金','土','GOLD'],['白金','金','WHITE'],['红金','火','RED']];const smooth=['今天很顺','比较合适','平稳一般','会比较累','成效偏弱'];
function headers(){return {'Content-Type':'application/json','X-Admin-Key':adminKey.value,'X-Admin-Name':adminName.value}}
function render(items){colors.innerHTML='';(items||presets.map((p,i)=>({rank:i+1,color:p[0],element:p[1],smoothness:smooth[i],suitable:['合作','沟通'],resistance:'可能需要更多耐心',advice:'先确认重点再行动',product_code:p[2],incense_name:p[0]+'财库香',scent:'请填写香气描述'}))).forEach((x,i)=>{const d=document.createElement('div');d.className='color-card';d.innerHTML=`<div class="color-head"><b>${x.color} · ${x.element}</b><span>固定商品 ${x.product_code}</span></div><div class="color-fields"><label>排名<input data-k="rank" type="number" min="1" max="5" value="${x.rank}"></label><label>顺畅度<select data-k="smoothness">${smooth.map(v=>`<option ${v===x.smoothness?'selected':''}>${v}</option>`).join('')}</select></label><label>适合事项<input data-k="suitable" value="${(x.suitable||[]).join('、')}"></label><label>可能阻力<textarea data-k="resistance">${x.resistance}</textarea></label><label>行动建议<textarea data-k="advice">${x.advice}</textarea></label></div><div class="grid"><label>香品名称<input data-k="incense_name" value="${x.incense_name}"></label><label>香气描述<input data-k="scent" value="${x.scent}"></label></div>`;d.dataset.color=x.color;d.dataset.element=x.element;d.dataset.product=x.product_code;colors.appendChild(d)})}
function payload(){const items=[...colors.children].map(d=>{const get=k=>d.querySelector(`[data-k="${k}"]`).value;return{rank:+get('rank'),color:d.dataset.color,element:d.dataset.element,smoothness:get('smoothness'),suitable:get('suitable').split(/[、,，]/).filter(Boolean),resistance:get('resistance'),advice:get('advice'),product_code:d.dataset.product,incense_name:get('incense_name'),scent:get('scent')}});return{guide_date:guideDate.value,weekday:weekday.value,lunar_date:lunarDate.value,solar_term:solarTerm.value,day_ganzhi:dayGanzhi.value,items,share_title:shareTitle.value,share_summary:shareSummary.value,push_summary:pushSummary.value,rule_version:ruleVersion.value}}
async function jsonFetch(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data));return data}
function show(v){result.textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}
async function loadGuide(){try{const d=await jsonFetch('/api/admin/public-guides/'+guideDate.value);weekday.value=d.weekday;lunarDate.value=d.lunar_date;solarTerm.value=d.solar_term;dayGanzhi.value=d.day_ganzhi;shareTitle.value=d.share_title;shareSummary.value=d.share_summary;pushSummary.value=d.push_summary;ruleVersion.value=d.rule_version;currentStatus.value=d.status;render(d.items);show(d)}catch(e){show('读取失败：'+e.message)}}
async function saveDraft(){try{const d=await jsonFetch('/api/admin/public-guides',{method:'POST',body:JSON.stringify(payload())});currentStatus.value=d.status;show(d)}catch(e){show('保存失败：'+e.message)}}
async function act(name){try{const d=await jsonFetch(`/api/admin/public-guides/${guideDate.value}/${name}`,{method:'POST',body:'{}'});currentStatus.value=d.status;show(d)}catch(e){show('操作失败：'+e.message)}}
async function scheduleGuide(){if(!scheduleAt.value)return show('请选择定时发布时间');try{const d=await jsonFetch(`/api/admin/public-guides/${guideDate.value}/schedule`,{method:'POST',body:JSON.stringify({scheduled_at:new Date(scheduleAt.value).toISOString()})});currentStatus.value=d.status;show(d)}catch(e){show('排期失败：'+e.message)}}
async function downloadTemplate(){const r=await fetch('/api/admin/public-guides/template.xlsx',{headers:{'X-Admin-Key':adminKey.value,'X-Admin-Name':adminName.value}});if(!r.ok)return show('模板下载失败');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='今日五色批量导入模板.xlsx';a.click();URL.revokeObjectURL(a.href)}
async function importExcel(){const file=excelFile.files[0];if(!file)return show('请先选择.xlsx文件');const form=new FormData();form.append('file',file);try{const r=await fetch('/api/admin/public-guides/import',{method:'POST',headers:{'X-Admin-Key':adminKey.value,'X-Admin-Name':adminName.value},body:form});const d=await r.json();if(!r.ok)throw new Error(d.detail||'导入失败');show(d)}catch(e){show(e.message)}}
guideDate.value=new Date().toISOString().slice(0,10);render();
</script></body></html>
